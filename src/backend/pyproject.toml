[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-yield-analyser"
version = "0.1.0"
description = "Wafer Yield Root Cause & Defect Pattern Analyser — Team LogicX S1"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Database
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "aiosqlite==0.20.0",
    # Data / Analytics
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "scikit-learn==1.4.2",
    # Config / Validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "anyio==4.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "data*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
