[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-yield-analyser"
version = "0.1.0"
description = "Wafer Yield Root Cause & Defect Pattern Analyser — Team LogicX S1"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Web framework
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    # Database
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "aiosqlite>=0.20,<1.0",
    # Data / Analytics
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.4,<2.0",
    # Config / Validation
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "anyio>=4.3,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "data*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
